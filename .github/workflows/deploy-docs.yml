name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "packages/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# Only one deployment at a time, and let a newer commit supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      # The site consumes the packages' dist/, so they have to be built first.
      - run: npm run build
      - run: npm run build:docs
        env:
          # Pages serves the site under /docs-overlay.
          BASE_PATH: /docs-overlay
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
