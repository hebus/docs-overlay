name: Release PR

on:
  push:
    branches:
      - main

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Opens or updates the "chore: version packages" pull request while changesets are pending.
      # Publishing is deliberately **not** done here: `npm run release` is run locally, so the tarball
      # that reaches npmjs is the one that was verified on a real machine, and no long-lived npm token
      # has to live in CI.
      - uses: changesets/action@v1
        with:
          version: npm run changeset:version
          commit: "chore: version packages"
          title: "chore: version packages #skip-changeset"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
