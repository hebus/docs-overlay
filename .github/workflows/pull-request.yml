name: CI

on:
  pull_request:
    branches:
      - main
  # Also on `main` itself, so the badge in the readme has a branch result to report. A merge has
  # already been verified as a pull request, so this run is redundant by design — it exists to make
  # the claim "these checks pass on main" checkable rather than asserted.
  push:
    branches:
      - main
  # So the whole chain can be exercised against `main` without opening a pull request.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Validates the published `exports` map: typechecks the adapter against the
      # built d.ts of the core, with no source alias in play.
      - run: npm run typecheck:packaged
      # Packs the core and runs it in a directory with no node_modules at all, so the
      # framework-independence rule is proven on the artefact and not only on the sources.
      - run: npm run verify:independence
      # The journal is what the migration guide and the command surface are derived from. Both
      # checks defend that: one refuses a journal that could have been reconstructed afterwards,
      # the other refuses documentation that quietly dropped a judgement or a pitfall it recorded.
      - run: npm run check:journal
      - run: npm run check:coverage

  sites:
    # Separate job so a Next or MDX failure reads as such, instead of looking like a library failure.
    # Each example's `postbuild` asserts the exported HTML, which is the end-to-end test of the
    # product — one for a single documentation, one for several side by side; the docs site is built
    # because it is the only consumer of the packages' published `exports`.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:example
      - run: npm run build:example:multi
      - run: npm run build:docs
