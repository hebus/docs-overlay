name: Changeset check

on:
  pull_request:
    branches:
      - main
    # `edited` is not in the default set, and without it the escape hatch this job prints in its own error
    # message cannot work: adding `#skip-changeset` to the title triggers nothing, so the failed run stands.
    # Re-running it by hand does not help either — a re-run replays the original event payload, title
    # included — which leaves an empty commit as the only way out of a check that is telling you what to do.
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    # Skip on the automated release PR, and when the author opted out via the title.
    if: >-
      github.head_ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.title, '#skip-changeset')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a new changeset
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD -- '.changeset/*.md' \
            | grep -v '.changeset/README.md' || true)
          if [ -z "$added" ]; then
            echo "::error::No changeset added. Run \`npx changeset\` (or create .changeset/<name>.md by hand)."
            echo "If this PR does not touch a published package, add #skip-changeset to the PR title."
            exit 1
          fi
          echo "Changesets added:"
          echo "$added"
